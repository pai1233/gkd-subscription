name: Upstream Sync Subscriptions

on:
  schedule:
    # 每天北京时间早晨 5:00 运行
    # GitHub Actions 使用 UTC 时间，北京时间是 UTC+8
    # 5:00 CST = 21:00 UTC (前一天)
    - cron: '0 21 * * *'
  workflow_dispatch: # 允许手动触发以便测试

permissions:
  contents: write

jobs:
  # 任务 1: 同步 aoguai
  sync_aoguai:
    name: Sync aoguai_gkd.json5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and update aoguai_gkd.json5
        run: |
          echo "[info] 下载 aoguai 订阅数据..."
          curl -L -o aoguai_gkd.json5 "https://raw.githubusercontent.com/aoguai/subscription/refs/heads/custom/dist/aoguai_gkd.json5"
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add aoguai_gkd.json5
          if ! git diff --staged --quiet; then
            git commit -m "auto-update: aoguai_gkd.json5"
            echo "[success] 检测到更新，准备推送。"
          else
            echo "[info] 没有检测到变更。"
          fi

      - name: Push changes
        if: success()
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

  # 任务 2: 同步 ganlinte
  sync_ganlin:
    name: Sync ganlin_gkd.json5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and update ganlin_gkd.json5
        run: |
          echo "[info] 下载 ganlinte 订阅数据..."
          # 注意：您提供的链接是 json5，文件名也要求是 json5
          curl -L -o ganlin_gkd.json5 "https://raw.githubusercontent.com/ganlinte/GKD-subscription/refs/heads/main/dist/ganlin_gkd.json5"
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add ganlin_gkd.json5
          if ! git diff --staged --quiet; then
            git commit -m "auto-update: ganlin_gkd.json5"
            echo "[success] 检测到更新，准备推送。"
          else
            echo "[info] 没有检测到变更。"
          fi

      - name: Push changes
        if: success()
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

  # 任务 3: 同步 MengNianxiaoyao
  sync_mengnian:
    name: Sync MengNianxiaoyao_gkd.json5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and update MengNianxiaoyao_gkd.json5
        run: |
          echo "[info] 下载 MengNianxiaoyao 订阅数据..."
          curl -L -o MengNianxiaoyao_gkd.json5 "https://raw.githubusercontent.com/MengNianxiaoyao/gkd-subscription/refs/heads/main/dist/gkd.json5"
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add MengNianxiaoyao_gkd.json5
          if ! git diff --staged --quiet; then
            git commit -m "auto-update: MengNianxiaoyao_gkd.json5"
            echo "[success] 检测到更新，准备推送。"
          else
            echo "[info] 没有检测到变更。"
          fi

      - name: Push changes
        if: success()
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
