name: Upstream Sync Subscriptions

on:
  schedule:
    # 每天北京时间早晨 5:00 运行 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 使用 max-parallel: 1 确保三个任务按顺序执行，避免自我冲突
  sync_all:
    name: Sync Subscriptions
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # 关键：一次只运行一个任务，防止并行冲突
      matrix:
        include:
          - file_name: aoguai_gkd.json5
            url: https://raw.githubusercontent.com/aoguai/subscription/refs/heads/custom/dist/aoguai_gkd.json5
            commit_msg: "auto-update: aoguai_gkd.json5"
          - file_name: ganlin_gkd.json5
            url: https://raw.githubusercontent.com/ganlinte/GKD-subscription/refs/heads/main/dist/ganlin_gkd.json5
            commit_msg: "auto-update: ganlin_gkd.json5"
          - file_name: MengNianxiaoyao_gkd.json5
            url: https://raw.githubusercontent.com/MengNianxiaoyao/gkd-subscription/refs/heads/main/dist/gkd.json5
            commit_msg: "auto-update: MengNianxiaoyao_gkd.json5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取完整历史以便 rebase

      - name: Download and Update ${{ matrix.file_name }}
        run: |
          echo "[info] 处理文件：${{ matrix.file_name }}"
          
          # 1. 下载文件
          curl -L -o "${{ matrix.file_name }}" "${{ matrix.url }}"
          
          # 2. 配置 Git 用户
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 3. 添加文件
          git add "${{ matrix.file_name }}"
          
          # 4. 检查是否有变化
          if ! git diff --staged --quiet; then
            # 如果有变化，先提交
            git commit -m "${{ matrix.commit_msg }}"
            
            echo "[info] 已提交更改，正在拉取远程最新代码以避免冲突..."
            
            # 5. 关键步骤：拉取并变基 (Rebase)
            # 如果远程有更新，这会将我们的 commit 移到远程最新 commit 之上
            git pull --rebase origin main
            
            echo "[info] 推送更改..."
            # 6. 推送
            git push origin main
          else
            echo "[info] 文件无变化，跳过提交和推送。"
          fi
